<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Theme -->
    <meta name="theme-color" content="#f7f5f0" />
    <meta name="color-scheme" content="light" />

    <!-- Primary Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32.png"
    />

    <!-- Apple -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon-180.png"
    />

    <!-- Android / PWA -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- SEO -->
    <title>Glass n Wood | Glasswork, Woodwork & Interiors in Siwan, Bihar</title>

      name="description"
      content="Glass n Wood crafts glasswork, woodwork, custom furniture and commercial interiors in Siwan, Bihar."

    <!-- Performance -->
    <link
      rel="preconnect"
      href="https://images.unsplash.com"
      crossorigin
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Glass n Wood" />
    <meta property="og:url" content="https://www.glassnwood.in/" />

      property="og:title"

      property="og:description"
